# =============================================================================
# GSUIF Component Catalog — components.yaml
# Ticket: SCRUM-39 (T-07: Component Catalog Skeleton)
# Blocked by: SCRUM-35 (T-06, Done)
# Blocks: SCRUM-20 (T-13: Metadata JSON Schema Design)
#         SCRUM-45 (T-17: Component Catalog v1)
# Owner: M1 — Sondos Hashem | Reviewer: M2 — Alaa Elmassry
#
# Legend
#   scope: GEN  = applies to AI/template-generated code only
#          SYS  = applies to our own framework/system code only
#          BOTH = applies to both
#   requirement_status: MANDATORY | DEFERRED | EXCLUDED
#   target_phase: PHASE_1 | PHASE_2_OR_LATER
#   standards:           checklist items that apply to the whole component
#   sys_only_standards:  checklist items tagged SYS in standards-checklist.md
#                        that apply only to the framework half of a BOTH
#                        component. Never applied to generated artifacts.
#   mandatory_subitems: required within the active component
#   deferred_subitems: explicitly postponed beyond Phase 1
#   open_subitems: unresolved requirement; not silently treated as deferred
#   excluded_subitems: explicitly outside the approved framework scope
#
# Every active or deferred entry below traces to at least one entry in
# source_documents, a Jira issue, a DECISIONS.md item, or a direct statement
# in mts-meeting-2.txt. Nothing in this file is invented. Known traceability
# gaps are recorded explicitly under `traceability_gaps` rather than left
# implicit.
# =============================================================================

catalog_version: "0.6"
generated_for: "SCRUM-39 (T-07)"

# `dependencies` records implementation prerequisites aligned with Jira's
# blocked-by chain. It does not imply runtime coupling or standards inheritance.
dependency_semantics: IMPLEMENTATION_PREREQUISITES

# A standard listed under `standards` applies to every artifact the component
# covers. A standard listed under `sys_only_standards` applies to the framework
# implementation only and must NOT be enforced against generated artifacts by
# T-17 or the SCRUM-50 golden tests.
standards_semantics: DIRECTLY_APPLICABLE_TO_COMPONENT

# `tool` and `template` are intentionally null on every entry. They are filled
# in by the spike consolidation and catalog v1 tickets, not by T-07.
tool_template_resolution:
  filled_by:
    - "SCRUM-40 (T-11: Capability Matrix v1 — consolidate both spikes)"
    - "SCRUM-45 (T-17: Component Catalog v1 — tool/template decisions)"
  inputs:
    - "SCRUM-37 (T-08: Jmix Capability Spike, Done)"
    - "SCRUM-38 (T-09: OpenAPI Generator Capability Spike, Done)"
  downstream_consumers:
    - "SCRUM-44 (T-40: Phase 1 Template Foundation & Catalog Support)"

category_values:
  - Architecture
  - Metadata
  - Cross-Cutting
  - Security
  - Audit
  - Generation
  - Frontend
  - Testing
  - Traceability

phase_scope:
  phase: PHASE_1
  focus: BACKEND_METADATA_AND_GENERATION
  rationale: >
    mts-meeting-2.txt records the supervisor directing the team to start with
    the backend and confirming that Phase 1 is the metadata layer.
    DECISIONS.md DEC-014 lists the Phase 1 backend scope explicitly;
    DEC-019 defers frontend/UI deliverables behind it.
    Jira confirms the same split structurally: SCRUM-12 (E9 — Metadata
    Extension) and SCRUM-15 (E12 — Frontend Angular) are both titled
    "(Phase 2)" in the backlog, and SCRUM-15's own notes state the frontend
    "deliberately follows the backend metadata foundation, per the confirmed
    phase strategy."
  phase_1_includes:
    - Metadata schema, persistence, CRUD APIs, structural + business-rule validation, immutable versioning
    - Backend cross-cutting framework (ApiResponse envelope, global exception handling, AOP logging, Swagger/OpenAPI)
    - "Security: stateless JWT authentication, basic RBAC (@PreAuthorize)"
    - "Audit: JPA Auditing + Hibernate Envers"
    - Deterministic, provider-agnostic code generation via TemplateOnlyProvider (Apache FreeMarker)
    - Minimal Angular component and Spring REST controller template outputs required by SCRUM-28/T-28; this does not include the Phase 2 Angular application
    - Build validation and generated-artifact traceability (Generation Run / Generated Artifact registry)
  phase_2_or_post_mvp_deferred:
    - Full UI Component Metadata Catalog (SCRUM-12 / E9, Phase 2)
    - Angular Frontend Application (SCRUM-15 / E12, Phase 2)
    - External AI Generation Provider (SCRUM-13 / E10, Phase 2; ADR-002/ADR-003)
    - Full/Dynamic RBAC — policy engine, entity- and field-level permissions (SCRUM-14 / E11, Phase 2; DEC-017)
    - GraphQL Generator (Excel Backend Deliverable 6; DEC-015)
    - Metadata Cache Framework / Redis (Excel Backend Deliverable 7; DEC-011)
    - Password Management Module — reset/email/SMS (Excel Backend Deliverable 10; DEC-018)
    - API Gateway (Technical Document §API Gateway; DEC-016)

