# =============================================================================
# KNOWN TRACEABILITY GAPS
# Recorded openly rather than left implicit, so review can act on them.
# =============================================================================

traceability_gaps:

  - id: TG-03
    summary: "Seven of ten source documents are not version-controlled."
    detail: >
      DOC-01, DOC-02, DOC-03, DOC-04, DOC-08, DOC-09 and DOC-10 live outside
      the repository (see `in_repo: false`). Only DECISIONS.md, QUESTIONS.md
      and standards-checklist.md are in git, so a reviewer without the shared
      drive cannot verify the majority of locators, and those locators can rot
      silently as the documents are revised.
    action: >
      Add a docs/sources/ folder, or a manifest recording each document's
      version and checksum, so locators can be verified and drift detected.
    affects_acceptance_criteria: false
    owner: "Team"

  - id: TG-04
    summary: "DEC-014 has a competing definition pending in an open pull request."
    detail: >
      On develop, DEC-014 is the Phase 1 core backend scope decision, which is
      the meaning used by phase_scope.rationale and by BE-05's Bulk Operations
      deferral. Pull request #4 (SCRUM-37, Jmix capability spike) introduces a
      second DEC-014 meaning "Jmix rejected as GSUIF generation foundation".
      If that merges, every DEC-014 citation in this file silently changes
      meaning.
    action: >
      Renumber the Jmix decision to DEC-021 in PR #4 before either pull
      request merges, then confirm this file's DEC-014 citations still resolve.
    affects_acceptance_criteria: false
    owner: "M2 — Alaa Elmassry (PR #4 author)"
