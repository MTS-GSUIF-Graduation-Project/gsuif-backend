services:
  postgres:
    image: postgres:16
    container_name: gsuif-postgres
    environment:
      POSTGRES_DB: gsuif_db
      POSTGRES_USER: gsuif_user
      POSTGRES_PASSWORD: gsuif_pass
    ports:
      - "5432:5432"
    volumes:
      - gsuif-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsuif_user -d gsuif_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gsuif-postgres-data:
