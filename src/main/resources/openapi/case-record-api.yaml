# SCRUM-44 fixed integration fixture, separate from the WorkOrder capability spike.
openapi: 3.0.3
info:
  title: CaseRecord fixture API
  version: 1.0.0
paths:
  /api/v1/case-records:
    get:
      tags: [CaseRecord]
      operationId: listCaseRecords
      x-gsuif-payload-java-type: com.example.fixture.dto.CaseRecordPage
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CaseRecordStatus' }
      responses:
        '200':
          description: Case records listed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseRecordPageResponse' }
    post:
      tags: [CaseRecord]
      operationId: createCaseRecord
      x-gsuif-payload-java-type: com.example.fixture.dto.CaseRecordDto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRecordRequest' }
      responses:
        '201':
          description: Case record created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseRecordDtoResponse' }
  /api/v1/case-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [CaseRecord]
      operationId: getCaseRecordById
      x-gsuif-payload-java-type: com.example.fixture.dto.CaseRecordDto
      responses:
        '200':
          description: Case record retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseRecordDtoResponse' }
    put:
      tags: [CaseRecord]
      operationId: updateCaseRecord
      x-gsuif-payload-java-type: com.example.fixture.dto.CaseRecordDto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCaseRecordRequest' }
      responses:
        '200':
          description: Case record updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseRecordDtoResponse' }
    delete:
      tags: [CaseRecord]
      operationId: deleteCaseRecord
      x-gsuif-payload-java-type: java.lang.Void
      responses:
        '200':
          description: Case record deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseRecordVoidResponse' }
components:
  schemas:
    CaseRecordStatus:
      type: string
      enum: [OPEN, CLOSED]
    CaseRecordDto:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/CaseRecordStatus' }
    CreateCaseRecordRequest:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { $ref: '#/components/schemas/CaseRecordStatus' }
    UpdateCaseRecordRequest:
      type: object
      properties:
        title: { type: string }
        status: { $ref: '#/components/schemas/CaseRecordStatus' }
    CaseRecordPage:
      type: object
      required: [data, totalPages, totalElements, size, number]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CaseRecordDto' }
        totalPages: { type: integer, format: int32 }
        totalElements: { type: integer, format: int64 }
        size: { type: integer, format: int32 }
        number: { type: integer, format: int32 }
    CaseRecordDtoResponse:
      type: object
      required: [status, clientMessage, statusCode, body, errors]
      properties:
        status: { type: string, example: OK }
        clientMessage: { type: string }
        statusCode: { type: integer, format: int32 }
        body: { $ref: '#/components/schemas/CaseRecordDto' }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
    CaseRecordPageResponse:
      type: object
      required: [status, clientMessage, statusCode, body, errors]
      properties:
        status: { type: string, example: OK }
        clientMessage: { type: string }
        statusCode: { type: integer, format: int32 }
        body: { $ref: '#/components/schemas/CaseRecordPage' }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
    CaseRecordVoidResponse:
      type: object
      required: [status, clientMessage, statusCode, body, errors]
      properties:
        status: { type: string, example: OK }
        clientMessage: { type: string }
        statusCode: { type: integer, format: int32 }
        body: { type: object, nullable: true }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
