spring:
  datasource:
    url: jdbc:h2:mem:gsuif_${random.uuid};MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/V1__init_schema.sql
        - classpath:sql/test-support-schema.sql
  jpa:
    hibernate:
      ddl-auto: validate
