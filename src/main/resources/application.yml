spring:
  application:
    name: gsuif
  profiles:
    default: local
  jpa:
    open-in-view: false

server:
  port: 8080

gsuif:
  security:
    mode: dev # Options: dev (open endpoints for testing) | test | prod (enforced JWT)
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
