# Separately selected SCRUM-65 paginated StockUnit fixture. Version 2.0.0 remains unchanged.
openapi: 3.0.3
info:
  label: StockUnit fixture API
  version: 3.0.0
paths:
  /api/v1/stock-units:
    get:
      tags: [StockUnit]
      operationId: scanStockUnits
      x-gsuif-payload-java-type: com.example.inventory.dto.StockUnitPage
      x-gsuif-ordering: { field: id, direction: ASC }
      parameters:
        - name: condition
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StockUnitCondition' }
        - name: label
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StockUnitLabel' }
        - name: page
          in: query
          required: false
          schema: { type: integer, format: int32, default: 0, minimum: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Stock units listed in ascending entity-ID order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitPageResponse' }
        '400':
          description: Invalid pagination or filter query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitErrorResponse' }
    post:
      tags: [StockUnit]
      operationId: registerStockUnit
      x-gsuif-payload-java-type: com.example.inventory.dto.StockUnitDto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStockUnitRequest' }
      responses:
        '201':
          description: Stock unit created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitDtoResponse' }
  /api/v1/stock-units/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [StockUnit]
      operationId: inspectStockUnit
      x-gsuif-payload-java-type: com.example.inventory.dto.StockUnitDto
      responses:
        '200':
          description: Stock unit retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitDtoResponse' }
        '404':
          description: StockUnit not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitErrorResponse' }
    put:
      tags: [StockUnit]
      operationId: replaceStockUnit
      x-gsuif-payload-java-type: com.example.inventory.dto.StockUnitDto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStockUnitRequest' }
      responses:
        '200':
          description: Stock unit updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitDtoResponse' }
        '400':
          description: Missing or invalid editable field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitErrorResponse' }
        '404':
          description: StockUnit not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitErrorResponse' }
    delete:
      tags: [StockUnit]
      operationId: discardStockUnit
      x-gsuif-payload-java-type: java.lang.Void
      responses:
        '200':
          description: Stock unit deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitVoidResponse' }
        '404':
          description: StockUnit not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockUnitErrorResponse' }
components:
  schemas:
    StockUnitCondition:
      type: string
      enum: [OPEN, CLOSED]
    StockUnitLabel:
      type: string
    StockUnitDto:
      type: object
      required: [id, label, condition, retiredOn]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        condition: { $ref: '#/components/schemas/StockUnitCondition' }
        retiredOn: { type: string, format: date, nullable: true }
    CreateStockUnitRequest:
      type: object
      required: [label, condition, retiredOn]
      properties:
        label: { type: string }
        condition: { $ref: '#/components/schemas/StockUnitCondition' }
        retiredOn: { type: string, format: date, nullable: true }
    UpdateStockUnitRequest:
      type: object
      required: [label, condition, retiredOn]
      properties:
        label: { type: string }
        condition: { $ref: '#/components/schemas/StockUnitCondition' }
        retiredOn: { type: string, format: date, nullable: true }
    StockUnitPage:
      type: object
      required: [data, totalPages, totalElements, size, number]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StockUnitDto' }
        totalPages: { type: integer, format: int32 }
        totalElements: { type: integer, format: int64 }
        size: { type: integer, format: int32 }
        number: { type: integer, format: int32 }
    StockUnitDtoResponse:
      type: object
      required: [status, clientMessage, statusCode, body, errors]
      properties:
        status: { type: string, example: OK }
        clientMessage: { type: string }
        statusCode: { type: integer, format: int32 }
        body: { $ref: '#/components/schemas/StockUnitDto' }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
    StockUnitPageResponse:
      type: object
      required: [status, clientMessage, statusCode, body, errors]
      properties:
        status: { type: string, example: OK }
        clientMessage: { type: string }
        statusCode: { type: integer, format: int32 }
        body: { $ref: '#/components/schemas/StockUnitPage' }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
    StockUnitVoidResponse:
      type: object
      required: [status, clientMessage, statusCode, body, errors]
      properties:
        status: { type: string, example: OK }
        clientMessage: { type: string }
        statusCode: { type: integer, format: int32 }
        body: { type: object, nullable: true }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
    StockUnitErrorResponse:
      type: object
      required: [status, clientMessage, statusCode, body, errors]
      properties:
        status: { type: string, example: NOT_FOUND }
        clientMessage: { type: string }
        statusCode: { type: integer, format: int32, example: 404 }
        body: { type: object, nullable: true }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
